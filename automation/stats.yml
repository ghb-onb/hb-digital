name: 反馈数据统计

# 计算层 + 数据导出：把 Issues 聚合成 stats.json，
# 供首页数据看板直接读取（前端只读静态 JSON，不打 API，不会被限流）。
on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时
  workflow_dispatch:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]

permissions:
  issues: read
  contents: write

concurrency:
  group: consult-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 聚合咨询数据
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;

            // 1. 分页拉全部咨询（state=all）
            let items = [];
            for (let page = 1; page <= 10; page++) {
              const { data } = await github.rest.issues.listForRepo({
                owner, repo, labels: '反馈', state: 'all',
                per_page: 100, page, sort: 'created', direction: 'desc',
              });
              if (!data.length) break;
              items = items.concat(data.filter(i => !i.pull_request));
              if (data.length < 100) break;
            }

            const now = Date.now();
            const weekAgo = now - 7 * 864e5;
            const monthAgo = now - 30 * 864e5;
            const t = i => new Date(i.created_at).getTime();

            // 2. 响应时长：只看最近 30 条，避免请求过多
            let responseHours = [];
            for (const issue of items.slice(0, 30)) {
              try {
                const { data: comments } = await github.rest.issues.listComments({
                  owner, repo, issue_number: issue.number, per_page: 100,
                });
                const first = comments.find(c => c.user && c.user.login === owner);
                if (first) {
                  const h = (new Date(first.created_at) - new Date(issue.created_at)) / 36e5;
                  if (h >= 0) responseHours.push(h);
                }
              } catch (e) {
                core.warning(`#${issue.number} 评论读取失败: ${e.message}`);
              }
            }
            const avg = arr => arr.length ? +(arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1) : null;

            // 3. 分类分布
            const byCategory = {};
            for (const i of items) {
              const body = i.body || '';
              const m = body.match(/### 反馈类型\s*\n+\s*([^\n]+)/);
              const key = m ? m[1].trim() : '未分类';
              byCategory[key] = (byCategory[key] || 0) + 1;
            }

            const stats = {
              total: items.length,
              open: items.filter(i => i.state === 'open').length,
              closed: items.filter(i => i.state === 'closed').length,
              thisWeek: items.filter(i => t(i) >= weekAgo).length,
              thisMonth: items.filter(i => t(i) >= monthAgo).length,
              avgResponseHours: avg(responseHours),
              byCategory,
              recent: items.slice(0, 5).map(i => ({
                number: i.number,
                title: (i.title || '').replace(/^\[咨询\]\s*/, ''),
                state: i.state,
                createdAt: i.created_at,
              })),
              updatedAt: new Date().toISOString(),
            };

            fs.writeFileSync('stats.json', JSON.stringify(stats, null, 2) + '\n');
            core.info(JSON.stringify(stats));

      - name: 提交回仓库
        run: |
          if [ -z "$(git status --porcelain stats.json)" ]; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git commit -m "chore(stats): 更新咨询统计 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
